<!DOCTYPE html>
<html>
<head>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />


  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  


<style>

    body{
        margin-bottom: 500px;
    }
 .carousel-indicators   button{
        width:20px !important;
        height: 20px !important;
        border-radius: 50%;
    }

    .carousel-indicators .active{
        background-color: orange;
    }
</style>
    
</head>
<body>



<div class="carousel slide" data-bs-ride="carousel" id="hello">



    <div class="carousel-indicators">

        <button data-bs-target="#hello" class="active" data-bs-slide-to="0"></button>
        <button data-bs-target="#hello" data-bs-slide-to="1"></button>
        <button data-bs-target="#hello" data-bs-slide-to="2"></button>

    </div>




    <div class="carousel-inner">

        <div class="carousel-item active" data-bs-interval="1000">
            <img src="images/slider_one.jpg" class="w-100 d-block" >
        <div class="carousel-caption">
            <h3>Nature is Beautiful</h3>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Omnis dignissimos iure porro magnam enim facilis cum, sunt consequatur exercitationem, dolores quidem ullam ipsam tempora, accusantium nobis consequuntur veritatis cupiditate debitis!</p>
        </div>

        </div>

        <div class="carousel-item" data-bs-interval="2000">
            <img src="images/slider_two.jpg" class="w-100 d-block">
        </div>

        <div class="carousel-item" data-bs-interval="3000">
            <img src="images/slider_three.jpg" class="w-100 d-block">
        </div>
        

    </div>




    <button class="carousel-control-next" data-bs-slide="next" data-bs-target="#hello">
        <span class="carousel-control-next-icon"></span>
    </button>


    <button class="carousel-control-prev" data-bs-slide="prev" data-bs-target="#hello">
        <span class="carousel-control-prev-icon"></span>
    </button>


    

</div>



    

</body>
</html>
