<!DOCTYPE html>
<html>
<head>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />


<style>

    body{
        margin-bottom: 500px;
    }
</style>
    
</head>
<body class="container mt-5">


<button class="btn btn-primary" data-bs-target="#hello" data-bs-toggle="modal">Message</button>


<div class="modal animate__animated animate__zoomInUp" id="hello" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header bg-light">
                <h4>Reading Message....</h4>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Ad eum sint rerum fugit consequatur quisquam cupiditate minus commodi minima vero id ab voluptas ipsa, ut numquam quod dolore culpa quos ipsam a nihil aut magnam. Dolore eveniet deleniti at ipsum!</p>

                
            </div>

            <div class="modal-footer">

                <button class="btn btn-danger" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-success">Save</button>
            </div>





        </div>
    </div>
</div>



</body>
</html>
